[package]
name = "fumpad"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "fumpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Compile in the mainnet program id from contracts/program-ids/mainnet.txt (build.rs) instead of the devnet one.
mainnet = []


[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token", "solana-v3"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
