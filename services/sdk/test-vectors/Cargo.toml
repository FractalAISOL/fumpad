# Generates services/sdk/test/vectors.json from the program's own math (contracts/programs/fumpad/src/math
# + rewards logic), so the TS port is tested against Rust numbers, not against itself.
# Run: `npm run vectors` (from services/). Standalone crate (own [workspace]); the script
# copies contracts/Cargo.lock in first so dependency versions match the programs.
[package]
name = "fumpad-vectors"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anchor-lang = "1.2.1"
fumpad = { path = "../../../contracts/programs/fumpad", features = ["no-entrypoint"] }
serde_json = "1"
