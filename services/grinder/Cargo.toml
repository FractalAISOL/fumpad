[package]
name = "fumpad-grinder"
version = "0.1.0"
edition = "2021"
description = "Pre-grinds vanity mint keypairs (base58 pubkey ending in a suffix, default `fmbL`) into Postgres, encrypted at rest (D18)."
publish = false

[[bin]]
name = "fumpad-grinder"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2.1"
bs58 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
zeroize = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
